name: Live I/O Smoke Test

on:
  workflow_dispatch:
    inputs:
      test_discord:
        description: "Kirim satu pesan smoke-test ke Discord"
        required: false
        default: false
        type: boolean

jobs:
  live-io:
    runs-on: ubuntu-latest
    env:
      TVTM_LIVE_IO: "1"
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TVTM_LIVE_DISCORD: ${{ inputs.test_discord && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run live I/O smoke tests
        run: pytest tests/test_live_io.py -v -m live
