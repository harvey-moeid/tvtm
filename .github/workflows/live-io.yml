name: Live I/O Smoke Test

on:
  workflow_dispatch:
    inputs:
      test_d1:
        description: "Jalankan smoke test Cloudflare D1"
        required: false
        default: false
        type: boolean
      test_discord:
        description: "Kirim satu pesan smoke-test ke Discord"
        required: false
        default: false
        type: boolean

jobs:
  okx-live:
    runs-on: ubuntu-latest
    env:
      TVTM_LIVE_IO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run OKX public API smoke tests
        run: pytest tests/test_live_io.py -v -m live -k okx

  d1-live:
    if: ${{ inputs.test_d1 }}
    runs-on: ubuntu-latest
    env:
      TVTM_LIVE_IO: "1"
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check D1 secret availability
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          test -n "$CF_ACCOUNT_ID"
          test -n "$CF_D1_DATABASE_ID"
          test -n "$CF_API_TOKEN"
      - name: Run D1 live smoke test
        run: pytest tests/test_live_io.py -v -m live -k d1

  discord-live:
    if: ${{ inputs.test_discord }}
    runs-on: ubuntu-latest
    env:
      TVTM_LIVE_IO: "1"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TVTM_LIVE_DISCORD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check Discord secret availability
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: test -n "$DISCORD_WEBHOOK_URL"
      - name: Run Discord live smoke test
        run: pytest tests/test_live_io.py -v -m live -k discord
