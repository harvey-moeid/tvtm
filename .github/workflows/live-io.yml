name: Live I/O Smoke Test

on:
  workflow_dispatch:
    inputs:
      test_github_state:
        description: "Jalankan smoke test Cloudflare R2"
        required: false
        default: false
        type: boolean
      test_discord:
        description: "Kirim satu pesan smoke-test ke Discord"
        required: false
        default: false
        type: boolean

jobs:
  okx-live:
    runs-on: ubuntu-latest
    env:
      TVTM_LIVE_IO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run OKX public API smoke tests
        run: pytest tests/test_live_io.py -v -m live -k okx

  github-state-live:
    if: ${{ inputs.test_github_state }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TVTM_LIVE_IO: "1"
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      TVTM_STATE_BRANCH: tvtm-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run GitHub JSON smoke test
        run: pytest tests/test_live_io.py -v -m live -k github_state

  discord-live:
    if: ${{ inputs.test_discord }}
    runs-on: ubuntu-latest
    env:
      TVTM_LIVE_IO: "1"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TVTM_LIVE_DISCORD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check Discord secret availability
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: test -n "$DISCORD_WEBHOOK_URL"
      - name: Run Discord live smoke test
        run: pytest tests/test_live_io.py -v -m live -k discord
