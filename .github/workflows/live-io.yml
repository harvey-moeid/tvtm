name: Live I/O Smoke Test

on:
  workflow_dispatch:
    inputs:
      test_r2:
        description: "Jalankan smoke test Cloudflare R2"
        required: false
        default: false
        type: boolean
      test_discord:
        description: "Kirim satu pesan smoke-test ke Discord"
        required: false
        default: false
        type: boolean

jobs:
  okx-live:
    runs-on: ubuntu-latest
    env:
      TVTM_LIVE_IO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run OKX public API smoke tests
        run: pytest tests/test_live_io.py -v -m live -k okx

  r2-live:
    if: ${{ inputs.test_r2 }}
    runs-on: ubuntu-latest
    env:
      TVTM_LIVE_IO: "1"
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_BUCKET: tvtm-data
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check R2 secret availability
        run: |
          test -n "$CF_ACCOUNT_ID"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
      - name: Run R2 live smoke test
        run: pytest tests/test_live_io.py -v -m live -k r2

  discord-live:
    if: ${{ inputs.test_discord }}
    runs-on: ubuntu-latest
    env:
      TVTM_LIVE_IO: "1"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TVTM_LIVE_DISCORD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check Discord secret availability
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: test -n "$DISCORD_WEBHOOK_URL"
      - name: Run Discord live smoke test
        run: pytest tests/test_live_io.py -v -m live -k discord
