name: Check Trading Signal

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: tv-alert-relay-check-signal
  cancel-in-progress: false

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify D1 target
        env:
          CONFIGURED_D1_ID: 29a7a81e-f41b-4d02-86c2-d387774723c9
          SECRET_D1_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          if [ "$SECRET_D1_ID" != "$CONFIGURED_D1_ID" ]; then
            echo "::error::CF_D1_DATABASE_ID secret tidak menunjuk ke tv-alert-relay yang dipakai dashboard."
            exit 1
          fi
          echo "D1 target OK: tv-alert-relay ($CONFIGURED_D1_ID)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run signal engine
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -m src.main

  notify-failure:
    name: Notify workflow failure
    needs: run-engine
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send failure alert to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = os.environ["DISCORD_WEBHOOK_URL"]
          run_url = os.environ["RUN_URL"]
          payload = {
              "username": "TV Alert Relay",
              "embeds": [{
                  "title": "TVTM Workflow Failed",
                  "description": "Check Trading Signal workflow gagal. Periksa GitHub Actions.",
                  "fields": [
                      {"name": "Repository", "value": os.environ["GITHUB_REPOSITORY"], "inline": True},
                      {"name": "Run", "value": f"[Open GitHub Actions]({run_url})", "inline": False},
                  ]
              }]
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              if response.status >= 300:
                  raise RuntimeError(f"Discord returned HTTP {response.status}")
          PY
