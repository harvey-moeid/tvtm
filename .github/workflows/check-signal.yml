name: Check Trading Signal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-signal.yml'
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: tv-alert-relay-check-signal
  cancel-in-progress: false

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run signal engine
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET: tvtm-data
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m src.main

  notify-failure:
    name: Notify workflow failure
    needs: run-engine
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send failure alert to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = os.environ["DISCORD_WEBHOOK_URL"]
          run_url = os.environ["RUN_URL"]
          payload = {
              "username": "TV Alert Relay",
              "embeds": [{
                  "title": "TVTM Workflow Failed",
                  "description": "Check Trading Signal workflow gagal. Periksa GitHub Actions.",
                  "fields": [
                      {"name": "Repository", "value": os.environ["GITHUB_REPOSITORY"], "inline": True},
                      {"name": "Run", "value": f"[Open GitHub Actions]({run_url})", "inline": False},
                  ]
              }]
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              if response.status >= 300:
                  raise RuntimeError(f"Discord returned HTTP {response.status}")
          PY
